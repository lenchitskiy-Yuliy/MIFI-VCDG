<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page">
    <main class="page__content">
      <article class="event-card">
        <p class="event-card__eyebrow">Вечер в музее</p>
        <h1 id="event-title" class="event-card__title">Ночь в музее</h1>
        <p id="event-date" class="event-card__date">15 ноября, 18:30</p>
        <p id="event-place">Музей космонавтики, проспект Мира, 111</p>
        <p id="event-description" class="event-card__description">
          Вечерняя программа с выставкой и экскурсиями
        </p>
        <button
          id="show-program"
          class="button button--secondary event-card__program-button"
          type="button"
        >
          Показать программу
        </button>
        <p id="program" class="event-card__program" hidden></p>
      </article>

      <p id="data-error" class="error" role="alert" hidden></p>

      <form id="service-form" class="service-form" hidden>
        <fieldset class="service-form__fields">
          <legend class="service-form__title">Дополните свой вечер</legend>
          <p class="service-form__description">
            Выберите услуги и рассчитайте стоимость посещения.
          </p>
          <label class="service-form__option" for="guide">
            <input
              id="guide"
              class="service-form__checkbox"
              type="checkbox"
              name="services"
              value="guide"
            />
            Экскурсия с гидом
            <span class="service-form__price"> 500 руб.</span>
          </label>
          <label class="service-form__option" for="audio">
            <input
              id="audio"
              class="service-form__checkbox"
              type="checkbox"
              name="services"
              value="audio"
            />
            Аудиогид <span class="service-form__price"> 350 руб.</span>
          </label>
          <label class="service-form__option" for="catalog">
            <input
              id="catalog"
              class="service-form__checkbox"
              type="checkbox"
              name="services"
              value="catalog"
            />
            Каталог выставки <span class="service-form__price"> 250 руб.</span>
          </label>
        </fieldset>
        <button class="button" type="submit">Рассчитать стоимость</button>
      </form>

      <p id="choice-error" class="error" role="alert" hidden></p>
      <p id="result" class="result" aria-live="polite" hidden></p>
      <pre id="report-json" class="report-json" hidden></pre>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
